name: "mcp-audit"
description: "Static security + correctness audit for MCP server repos. Fails CI on findings (configurable). Wraps the mcpdone-audit PyPI package."
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory or repo to scan."
    required: false
    default: "."
  version:
    description: "mcpdone-audit version to install (e.g. 0.8.0). Empty installs the latest."
    required: false
    default: ""
  package:
    description: >-
      Any pip install spec to use instead of the PyPI package: a local path
      ('./mcp-audit'), a VCS ref, or a private mirror. Takes precedence over
      'version'. Exists because the action installs from PyPI by default, so
      without this seam nothing can exercise a fix that has not been released
      yet - including this repo's own self-test.
    required: false
    default: ""
  args:
    description: "Extra args passed to mcp-audit (e.g. '--check command_injection')."
    required: false
    default: ""
  fail-on-findings:
    description: "Fail the job when any finding is reported. Set 'false' for report-only mode."
    required: false
    default: "true"
  python-version:
    description: "Python version to run mcp-audit under."
    required: false
    default: "3.12"

outputs:
  finding-count:
    description: "Number of findings reported by the scan."
    value: ${{ steps.scan.outputs.finding-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mcpdone-audit
      shell: bash
      run: |
        if [ -n "${{ inputs.package }}" ]; then
          python -m pip install --quiet "${{ inputs.package }}"
        elif [ -n "${{ inputs.version }}" ]; then
          python -m pip install --quiet "mcpdone-audit==${{ inputs.version }}"
        else
          python -m pip install --quiet mcpdone-audit
        fi
        echo "installed: $(python -m pip show mcpdone-audit | awk '/^Version:/{print $2}')"

    - name: Run mcp-audit
      id: scan
      shell: bash
      run: |
        set +e
        # Human-readable output to the job log.
        mcp-audit "${{ inputs.path }}" ${{ inputs.args }}
        code=$?
        # Machine-readable pass to a file (NOT a pipe: GitHub's shell runs with
        # pipefail, and mcp-audit exits 1 on findings, which would otherwise
        # corrupt the captured value). --json writes the object; exit code is
        # the same 0/1/2 and is captured above from the human run.
        mcp-audit "${{ inputs.path }}" ${{ inputs.args }} --json > mcp_audit_out.json 2>/dev/null || true
        count=$(python -c "import json; print(json.load(open('mcp_audit_out.json')).get('finding_count', 0))" 2>/dev/null || echo 0)
        rm -f mcp_audit_out.json
        printf 'finding-count=%s\n' "$count" >> "$GITHUB_OUTPUT"
        echo "::notice title=mcp-audit::${count} finding(s) (exit ${code})"
        if [ "$code" -eq 2 ]; then
          echo "::error title=mcp-audit::usage error (exit 2)"
          exit 2
        fi
        # Exit 3 means the scan examined zero files. That is a broken scan,
        # not a clean one, so it fails the job even in report-only mode:
        # a green check that read nothing is the worst outcome this action
        # can produce. Pass '--allow-empty' via `args` where a repo
        # legitimately holds no auditable code.
        if [ "$code" -eq 3 ]; then
          echo "::error title=mcp-audit::examined 0 files - check the 'path' input. This is not a clean result. Pass --allow-empty via 'args' if the repo genuinely has no auditable code."
          exit 1
        fi
        if [ "$code" -eq 1 ] && [ "${{ inputs.fail-on-findings }}" = "true" ]; then
          exit 1
        fi
        exit 0
